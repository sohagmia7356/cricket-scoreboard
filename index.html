<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Cricket Scoreboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:600px;margin:auto;padding:16px}.card{background:#121d2e;border-radius:18px;overflow:hidden;border:1px solid #263750}
.top{padding:18px;background:#0e1828;text-align:center}.live{font-weight:800;color:#ff6262}
.controls{display:flex;gap:8px;padding:14px}.controls input{flex:1;min-width:0;padding:13px;border:1px solid #334761;border-radius:10px;background:#0a1422;color:#fff}
button{padding:13px 16px;border:0;border-radius:10px;background:#2674ff;color:#fff;font-weight:700}
.status{text-align:center;color:#aebbd0;font-size:13px;padding-bottom:12px}
.team{display:flex;justify-content:space-between;align-items:center;padding:18px;border-top:1px solid #263750}
.name{font-size:18px;font-weight:700}.score{font-size:28px;font-weight:800}
.info{padding:14px 18px;color:#b8c4d5;border-top:1px solid #263750}
.section{padding:16px 18px;border-top:1px solid #263750}.title{font-size:13px;color:#8f9db2;margin-bottom:9px}
.row{display:flex;justify-content:space-between;padding:7px 0}.ball{display:inline-block;padding:6px 9px;margin:3px;background:#263750;border-radius:7px}
.error{color:#ff8181;text-align:center;padding:12px;display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="top"><div class="live">🔴 LIVE CRICKET</div></div>

<div class="controls">
  <input id="matchId" placeholder="এখানে Match ID লিখুন">
  <button onclick="loadScore()">LOAD</button>
</div>

<div id="status" class="status">Match ID দিয়ে LOAD চাপুন</div>
<div id="error" class="error"></div>

<div class="team"><span id="team1" class="name">Team 1</span><span id="score1" class="score">—</span></div>
<div class="team"><span id="team2" class="name">Team 2</span><span id="score2" class="score">—</span></div>

<div class="info">Overs: <b id="overs">—</b></div>

<div class="section">
<div class="title">CURRENT BATTERS</div>
<div class="row"><span id="batter1">—</span><b id="batter1Runs">—</b></div>
<div class="row"><span id="batter2">—</span><b id="batter2Runs">—</b></div>
</div>

<div class="section">
<div class="title">BOWLER</div>
<div class="row"><span id="bowler">—</span><b id="bowlerFigures">—</b></div>
</div>

<div class="section">
<div class="title">LAST BALLS</div>
<div id="balls">—</div>
</div>
</div></div>

<script>
/*
================ API SETTINGS ================
আপনার Cricket API অনুযায়ী শুধু এই ২টি জিনিস বসাবেন।
===============================================
*/
const API_KEY = "YOUR_API_KEY";

/*
এখানে {MATCH_ID} রেখে দিন।
উদাহরণ:
https://your-api.com/match/{MATCH_ID}
*/
const API_URL_TEMPLATE = "YOUR_LIVE_SCORE_API_URL/{MATCH_ID}";

let timer = null;

async function loadScore(){
  const id = document.getElementById("matchId").value.trim();
  const status = document.getElementById("status");
  const error = document.getElementById("error");

  if(!id){
    error.style.display="block";
    error.textContent="আগে Match ID লিখুন।";
    return;
  }

  error.style.display="none";
  status.textContent="Live score loading...";

  try{
    const url = API_URL_TEMPLATE.replace("{MATCH_ID}", encodeURIComponent(id));

    const response = await fetch(url,{
      headers:{
        "x-api-key": API_KEY
      }
    });

    if(!response.ok) throw new Error("API Error: " + response.status);

    const data = await response.json();
    updateScoreboard(data);

    status.textContent="Updated: " + new Date().toLocaleTimeString();

    clearInterval(timer);
    timer = setInterval(()=>loadScore(),10000);
  }catch(e){
    console.error(e);
    status.textContent="Update failed";
    error.style.display="block";
    error.textContent="API থেকে ডাটা পাওয়া যায়নি। API URL/Key/Match ID পরীক্ষা করুন।";
  }
}

function updateScoreboard(data){
  const m = data.match || data.data || data;

  document.getElementById("team1").textContent =
    m.team1?.name || m.team1 || "Team 1";

  document.getElementById("team2").textContent =
    m.team2?.name || m.team2 || "Team 2";

  document.getElementById("score1").textContent =
    m.team1?.score || m.score1 || "—";

  document.getElementById("score2").textContent =
    m.team2?.score || m.score2 || "—";

  document.getElementById("overs").textContent =
    m.overs || "—";

  document.getElementById("batter1").textContent =
    m.batter1?.name || "—";

  document.getElementById("batter1Runs").textContent =
    m.batter1?.score || "—";

  document.getElementById("batter2").textContent =
    m.batter2?.name || "—";

  document.getElementById("batter2Runs").textContent =
    m.batter2?.score || "—";

  document.getElementById("bowler").textContent =
    m.bowler?.name || "—";

  document.getElementById("bowlerFigures").textContent =
    m.bowler?.figures || "—";

  const balls = m.lastBalls || m.recentBalls || [];
  document.getElementById("balls").innerHTML =
    Array.isArray(balls) && balls.length
    ? balls.map(x=>`<span class="ball">${x}</span>`).join("")
    : "—";
}
</script>
</body>
</html>
